<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>教師學習紀錄｜教師節 A2</title><link rel="stylesheet" href="styles.css"><script src="config.js" defer></script><script src="teacher.js" defer></script></head><body><header class="topbar"><a class="brand" href="./"><span class="brandmark">學</span>教師節 A2</a><a href="share.html">課程 QR Code</a></header><main class="teacher-main"><p class="eyebrow">教師專用</p><h1 style="font-size:2.5rem">學生學習紀錄</h1><p>每一列代表一次進入課程。學號由學生自行輸入；完成代表已交出活動答案，不代表全部答對。時間以臺灣時間顯示。</p><form id="teacher-login" class="card"><label for="teacher-key">教師存取碼</label><input type="password" id="teacher-key" required autocomplete="off"><div class="form-actions"><button class="primary" type="submit">查看紀錄</button></div><p id="login-status" role="status"></p></form><section id="dashboard" hidden><div class="toolbar"><div><label for="filter-student">完整學號</label><input id="filter-student" placeholder="全部學號" maxlength="32"></div><div><label for="filter-date">進入日期</label><input type="date" id="filter-date"></div><button class="primary" id="refresh">查詢 / 重新整理</button><button class="sound" id="export">匯出 CSV</button><button class="text-button" id="logout">登出</button></div><div class="stats"><div class="stat">學生人數<strong id="stat-students">0</strong></div><div class="stat">進入次數<strong id="stat-visits">0</strong></div><div class="stat">完成全部活動的次數<strong id="stat-finished">0</strong></div></div><p id="records-status" role="status" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th scope="col">學號</th><th scope="col">進入時間</th><th scope="col">完成</th><th scope="col">閱讀 /5</th><th scope="col">生詞 /10</th><th scope="col">句型 /3</th><th scope="col">情境 /10</th><th scope="col">重組 /5</th><th scope="col">造句與完成時間</th></tr></thead><tbody id="records"></tbody></table><div class="empty" id="empty" hidden>目前沒有符合條件的紀錄。</div></div><div class="form-actions"><button id="load-more" class="sound" hidden>載入更多</button></div></section></main><footer><a href="./">返回學生課程</a></footer></body></html>

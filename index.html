      <div class="intro"><p class="eyebrow">09.28 · 教師節</p><h1>老師，<br>謝謝您。</h1><p class="lead">認識孔子和教師節，<br>用中文說出你的想法。</p><div class="lesson-tags"><span>閱讀</span><span>10 個生詞</span><span>3 個句型</span><span>互動練習</span></div></div>
      <div class="entry-card"><p class="eyebrow">開始今天的學習</p><h2>先填寫你的學號</h2><p>請使用自己的學號。老師會看到你的進入時間、完成活動和練習成績。</p><form id="entry-form"><label for="student-id">學號 <span lang="en">Student ID</span></label><input id="student-id" name="studentId" autocomplete="off" maxlength="32" pattern="[A-Za-z0-9_-]{2,32}" required placeholder="例如 115123456"><small>請輸入 2–32 個英文字母、數字、底線或連字號。</small><button type="submit" class="primary">開始學習 <span aria-hidden="true">→</span></button><p id="entry-status" role="status" aria-live="polite"></p></form><p class="privacy">只收集學號，不需要姓名或電子郵件。</p></div>
